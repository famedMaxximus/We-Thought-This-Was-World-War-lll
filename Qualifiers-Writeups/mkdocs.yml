site_name: "Lesotho 2026 Cyber Security Hackathon — Writeups"
site_url: "https://yourusername.github.io/Lesotho-CTF-Writeups"
repo_url: "https://github.com/yourusername/Lesotho-CTF-Writeups"
repo_name: "Lesotho-CTF-Writeups"

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - toc.integrate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - mermaid2

plugins:
  - search
  - mermaid2
  - git-revision-date-localized:
      enable_creation_date: true
  - git-authors:
      exclude:
        - "dependabot[bot]"
        - "github-actions[bot]"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/yourusername
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  generator: false

